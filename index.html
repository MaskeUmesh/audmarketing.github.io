<style>
:root{--bg:#050505;--panel:#12100d;--line:#2a2418;--ink:#eee7d6;--mute:#a79c84;--g1:#f8e0a0;--g2:#e3b04b;--g3:#a07222;--on-gold:#1a1305;--gold:linear-gradient(180deg,var(--g1),var(--g2) 50%,var(--g3));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505;--ink:#eee7d6}}
:root[data-theme="dark"]{--bg:#050505;--ink:#eee7d6}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Josefin Sans","Trebuchet MS",system-ui,sans-serif;font-weight:400;line-height:1.15;margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.mark{font:600 22px "Josefin Sans",sans-serif;letter-spacing:.18em;text-decoration:none}
nav .links{display:flex;gap:28px;align-items:center}
nav .links a{text-decoration:none;color:var(--mute);font-size:15px}
nav .links a:hover{color:var(--g1)}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font:600 15px "Hanken Grotesk",sans-serif;text-decoration:none;border:1.5px solid var(--g2);transition:background .2s,color .2s}
nav .links a.btn{color:var(--g1)}
.btn.fill,nav .links a.btn.fill{background:var(--gold);color:var(--on-gold);border-color:transparent}
.btn.fill:hover{filter:brightness(1.08)}
.btn.line{color:var(--g1)}
.btn.line:hover{background:rgba(227,176,75,.12)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--g1);outline-offset:3px}
.hero{text-align:center;padding:8px 0 88px;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:-40px;width:900px;max-width:140%;height:520px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(227,176,75,.20),transparent);pointer-events:none}
.logo{position:relative;display:block;width:min(760px,100%);margin:0 auto;-webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 55%,transparent 100%);animation:rise 1.4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.logo{animation:none}html{scroll-behavior:auto}}
.hero h1{position:relative;font-size:clamp(30px,5.2vw,52px);max-width:17em;margin:8px auto 18px}
.hero p{position:relative;color:var(--mute);font-size:19px;max-width:34em;margin:0 auto 34px}
.cta{position:relative;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
section{padding:72px 0;scroll-margin-top:12px}
.head{max-width:34em;margin-bottom:40px}
.head h2{font-size:clamp(28px,4vw,40px);margin-bottom:12px}
.head p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
a.svc{display:block;text-decoration:none;padding:26px 4px 8px;border-top:2px solid var(--g3);transition:border-color .2s}
a.svc:hover{border-top-color:var(--g1)}
.svc h3{font-size:23px;font-weight:600;margin-bottom:8px}
.svc p{margin:0 0 10px;color:var(--mute)}
.more{color:var(--g2);font-weight:600;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;counter-reset:s}
.step{padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.step::before{counter-increment:s;content:counter(s);display:block;font:600 30px "Josefin Sans",sans-serif;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.step h3{font-size:21px;font-weight:600;margin-bottom:6px}
.step p{margin:0;color:var(--mute);font-size:16px}
.crumb{display:inline-block;margin:8px 0 28px;color:var(--mute);text-decoration:none;font-size:15px}
.crumb:hover{color:var(--g1)}
.detail h1{font-size:clamp(34px,6vw,58px);margin-bottom:16px}
.lead{font-size:20px;color:var(--mute);max-width:36em;margin:0 0 40px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:56px}
.box{padding:28px 26px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
.box.hi{border:2px solid var(--g2);background:#18140c}
.box h2{font-size:24px;font-weight:600;margin-bottom:14px}
.box p{margin:0;color:var(--mute)}
.box ul{list-style:none;margin:0;padding:0}
.box li{position:relative;padding:6px 0 6px 22px}
.box li::before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--g2)}
.detail h2.sub{font-size:28px;margin:0 0 20px}
.others{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.others a{padding:9px 18px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px}
.others a:hover{border-color:var(--g2);color:var(--g1)}
.band{text-align:center;padding:64px 24px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(ellipse at 50% 0%,rgba(227,176,75,.16),transparent 70%),var(--panel)}
.band h2{font-size:clamp(28px,4vw,40px);margin-bottom:12px}
.band p{color:var(--mute);max-width:30em;margin:0 auto 28px}
footer{padding:44px 0 48px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}.soc{display:flex;gap:14px;justify-content:center}.soc a{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border:1.5px solid var(--line);border-radius:50%;color:var(--g2);transition:border-color .2s,color .2s}.soc a:hover{border-color:var(--g2);color:var(--g1)}.reach{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}.reach a{color:var(--mute);text-decoration:none}.reach a:hover{color:var(--g1)}
.menu{position:relative}.dots{display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;transition:border-color .2s}.dots:hover,.dots[aria-expanded="true"]{border-color:var(--g2)}.dots span{width:5px;height:5px;border-radius:50%;background:var(--g2)}.dots:focus-visible{outline:2px solid var(--g1);outline-offset:3px}.drop{position:absolute;right:0;top:calc(100% + 10px);min-width:210px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.6)}.drop[hidden]{display:none}.drop a{display:block;padding:11px 14px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:16px}.drop a:hover{background:rgba(227,176,75,.12);color:var(--g1)}.drop a.price{margin-top:6px;background:var(--gold);color:var(--on-gold);font-weight:600;text-align:center}.drop a.price:hover{background:var(--gold);color:var(--on-gold);filter:brightness(1.08)}
@media (max-width:640px){.hero{padding-bottom:64px}section{padding:56px 0}}
</style>
